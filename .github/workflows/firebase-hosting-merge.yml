name: Deploy to Firebase Hosting

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-avec-jo-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build website
        run: npm run build
      - name: Check content and SEO
        run: npm run check
      - name: Deploy live website
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AVEC_JO }}'
          projectId: avec-jo
          channelId: live
        env:
          FIREBASE_HOSTING_UPLOAD_CONCURRENCY: '3'
